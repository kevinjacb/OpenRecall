[project]
name = "sense-server"
version = "0.1.0"
description = "Sense — the brain. Server-side ingest, memory extraction, retrieval, and device command orchestration for the Sense wearable AI memory platform."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "websockets>=13",
    "cryptography>=43",  # Ed25519 signing of device commands (§D)
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]
# Heavyweight, Apple-Silicon-only runtime deps for the real ingest implementations
# and the RTF measurement harness. Not needed to run the unit tests.
mlx = [
    "mlx-whisper>=0.4",
    "numpy>=2",
]
opus = [
    "opuslib>=3.0",
]
# Provider-agnostic LLM client (extraction). Works against any OpenAI-compatible
# endpoint — local (Ollama, mlx_lm.server) or cloud (MiniMax/OpenAI/…).
llm = [
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sense_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
