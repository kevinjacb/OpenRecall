[project]
name = "openrecall-server"
version = "0.1.0"
description = "OpenRecall — the brain. Server-side ingest, memory extraction, retrieval, and device command orchestration for the OpenRecall wearable AI memory platform."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "websockets>=13",
    "aiohttp>=3.10",
    "cryptography>=43",  # Ed25519 signing of device commands (§D)
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]
# Heavyweight, Apple-Silicon-only runtime deps for the real ingest implementations
# and the RTF measurement harness. Not needed to run the unit tests.
mlx = [
    "mlx-whisper>=0.4",
    "numpy>=2",
]
opus = [
    "opuslib>=3.0",
]
# Real local speaker-embedding backend (Resemblyzer, CPU). Lazy-imported
# inside ResemblyzerSpeakerEmbedder._ensure_ready so the unit suite runs
# without it; install to use OPENRECALL_SPEAKER_EMBED_MODEL=resemblyzer.
speaker = [
    "resemblyzer>=0.1",
    "numpy>=2",
]
# Opt-in pre-Whisper spectral VAD gate (webrtcvad). Lazy-imported inside
# StreamingTranscriber so the unit suite and a default install run without
# it; install to use OPENRECALL_WHISPER_VAD_MODE=webrtc. Skips the Whisper
# call on pure-noise hops so it can't hallucinate on silence.
vad = [
    "webrtcvad>=2.0",
]
# Alternative streaming ASR backend: NVIDIA Parakeet-TDT via parakeet-mlx.
# Its transducer decoder emits a blank symbol on silence, so it does not
# produce Whisper's near-silence phantom phrases. Lazy-imported inside
# ParakeetStreamingBackend so the unit suite and a default install run
# without it; select at runtime with OPENRECALL_ASR_BACKEND=parakeet.
parakeet = [
    "parakeet-mlx>=0.5",
    "numpy>=2",
]
# Provider-agnostic LLM client (extraction). Works against any OpenAI-compatible
# endpoint — local (Ollama, mlx_lm.server) or cloud (MiniMax/OpenAI/…).
llm = [
    "httpx>=0.27",
]
# Video clip keyframe extraction (scene-change detection). Lazy-imported
# inside vision.clip.select_keyframes so the unit suite and a default install
# run without it; install to enable POST /media/videos (pip install -e '.[video]').
video = [
    "pillow>=10",
]
# Server-side spectral-gating denoise on the decoded PCM before transcription
# (and speaker embedding). Off by default (OPENRECALL_DENOISE_ENABLED=true);
# lazy-imported inside NoisereduceDenoiser so the unit suite and a default
# install run without it. INMP441 has no AGC and nothing filters the mic
# signal end-to-end, so this is the single biggest background-noise win and
# also lifts transcription accuracy by feeding the ASR cleaner audio.
denoise = [
    "noisereduce>=2.0",
    "numpy>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openrecall_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
filterwarnings = [
    # Brief uses string app/request keys; advisory only from aiohttp.
    "ignore:It is recommended to use web.AppKey instances for keys:UserWarning",
    "ignore:It is recommended to use web.RequestKey instances for keys:UserWarning",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
